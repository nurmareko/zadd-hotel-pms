name: CI

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    env:
      CI: "true"
      TZ: UTC
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/zadd_build_placeholder
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@127.0.0.1:1/zadd_build_placeholder
      AUTH_SECRET: ci-build-only-not-used-at-runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run pure tests
        run: npm test

      - name: Build
        run: npm run build

  db-tests:
    name: Database tests
    runs-on: ubuntu-latest
    env:
      CI: "true"
      TZ: UTC
      TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/zadd_test?schema=public
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/zadd_ci_guard_placeholder?schema=public
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@127.0.0.1:5432/zadd_ci_guard_placeholder?schema=public
    services:
      # Local and CI use PostgreSQL 16; confirm the production Neon major before changing this pin.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: zadd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d zadd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database tests
        run: npm run test:db
